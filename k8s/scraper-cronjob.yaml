# Periodic, not always-on: scans run every 30 minutes while the cluster
# exists. Before a demo/interview, force a fresh run instead of waiting on
# the schedule:
#   kubectl create job --from=cronjob/dealscout-scraper manual-scan
apiVersion: batch/v1
kind: CronJob
metadata:
  name: dealscout-scraper
spec:
  schedule: "*/30 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          imagePullSecrets:
            - name: ecr-pull-secret
          restartPolicy: Never
          containers:
            - name: scraper
              image: ${ECR_SCRAPER_IMAGE}
              env:
                - name: LISTINGS_CACHE_PATH
                  value: "/data/listings_cache.json"
              envFrom:
                - secretRef:
                    name: dealscout-secrets
              volumeMounts:
                - name: listings-cache
                  mountPath: /data
          volumes:
            - name: listings-cache
              persistentVolumeClaim:
                claimName: listings-cache
