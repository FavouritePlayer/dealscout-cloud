# Deployed alongside the API rather than run locally — see ARCHITECTURE.md
# for the tradeoff (this used to be laptop-only). Talks to the agent API
# over the in-cluster Service DNS name, not the public NodePort.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dealscout-frontend
spec:
  replicas: 1
  selector:
    matchLabels: { app: dealscout-frontend }
  template:
    metadata:
      labels: { app: dealscout-frontend }
    spec:
      imagePullSecrets:
        - name: ecr-pull-secret
      containers:
        - name: frontend
          image: ${ECR_FRONTEND_IMAGE}
          ports:
            - containerPort: 3000
          env:
            - name: BACKEND_URL
              value: "http://dealscout-api:8000"
          readinessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: dealscout-frontend
spec:
  type: NodePort
  selector: { app: dealscout-frontend }
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30081
