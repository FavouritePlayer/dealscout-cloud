# Always-on, not a CronJob: the agent API hits this service's /scrape
# over the cluster network to run a scrape on demand (e.g. the "Scrape
# now" button in the webapp), and it also re-scrapes on its own fixed
# interval in the background so the cache doesn't go stale if nobody
# clicks anything — see backend/scraper_job.py.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dealscout-scraper
spec:
  replicas: 1
  selector:
    matchLabels: { app: dealscout-scraper }
  template:
    metadata:
      labels: { app: dealscout-scraper }
    spec:
      imagePullSecrets:
        - name: ecr-pull-secret
      containers:
        - name: scraper
          image: ${ECR_SCRAPER_IMAGE}
          ports:
            - containerPort: 8001
          env:
            - name: LISTINGS_CACHE_PATH
              value: "/data/listings_cache.json"
          envFrom:
            - secretRef:
                name: dealscout-secrets
          volumeMounts:
            - name: listings-cache
              mountPath: /data
          readinessProbe:
            httpGet: { path: /health, port: 8001 }
            initialDelaySeconds: 5
      volumes:
        - name: listings-cache
          persistentVolumeClaim:
            claimName: listings-cache
---
apiVersion: v1
kind: Service
metadata:
  name: dealscout-scraper
spec:
  selector: { app: dealscout-scraper }
  ports:
    - port: 8001
      targetPort: 8001
